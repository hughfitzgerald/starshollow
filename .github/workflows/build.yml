name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.version.outputs.build_number }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch full history for versioning

      - name: Read Game Name from File
        id: gamename
        run: |
          game_name=$(head -n 1 gamename.txt | tr -d '\r' | xargs)
          echo "game_name=$game_name" >> "$GITHUB_OUTPUT"

      - name: Set Build Number from GitHub Run
        id: version
        run: |
          echo "build_number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Grunt CLI
        run: npm install -g grunt-cli

      - name: Run Grunt to Concat VPX Files and Set Production Mode
        env:
          GAME: ${{ steps.gamename.outputs.game_name }}
        run: |
          # Production mode relies on the functions glf cached during a local dev-mode run
          if [ ! -f cached-functions.vbs ]; then
            echo "::error::cached-functions.vbs is missing. Run the table locally in dev mode and commit it."
            exit 1
          fi

          cd scripts
          npm install
          grunt concat:prod
          cd ..

          # Switch glf to production mode and convert to CRLF line endings (as a Windows build would)
          sed -e 's/\r$//' \
              -e 's/^Dim glf_production_mode : glf_production_mode = False$/Dim glf_production_mode : glf_production_mode = True/' \
              -e 's/^Dim glf_FuncCount : glf_FuncCount = 0$/Dim glf_FuncCount : glf_FuncCount = 9999/' \
              -e 's/$/\r/' \
              "$GAME.vbs" > "$GAME/script.vbs"
          rm "$GAME.vbs"

          # Fail rather than ship a dev-mode table if glf's lines ever change
          grep -q '^Dim glf_production_mode : glf_production_mode = True' "$GAME/script.vbs" || { echo "::error::Could not enable glf_production_mode"; exit 1; }
          grep -q '^Dim glf_FuncCount : glf_FuncCount = 9999' "$GAME/script.vbs" || { echo "::error::Could not set glf_FuncCount"; exit 1; }

      - name: Modify Locked Property in JSON
        env:
          GAME: ${{ steps.gamename.outputs.game_name }}
        run: |
          jq '.locked = 1' "$GAME/gamedata.json" > temp.json
          mv temp.json "$GAME/gamedata.json"

      - name: Download vpxtool
        run: |
          mkdir vpxtool
          curl -sSL https://github.com/francisdb/vpxtool/releases/download/v0.34.8/vpxtool-Linux-x86_64-v0.34.8.tar.gz | tar -xz -C vpxtool
          # Put vpxtool on PATH so scripts/vpx-tool.js can find it
          echo "$PWD/vpxtool" >> "$GITHUB_PATH"

      - name: Assemble VPX File
        env:
          GAME: ${{ steps.gamename.outputs.game_name }}
          BUILD: ${{ steps.version.outputs.build_number }}
        run: |
          # Uses vpx-tool.js so copyrighted sounds missing from the repo are skipped
          node scripts/vpx-tool.js assemble
          mv "$GAME.vpx" "$GAME$BUILD.vpx"

      - name: Package Release Files
        env:
          GAME: ${{ steps.gamename.outputs.game_name }}
          BUILD: ${{ steps.version.outputs.build_number }}
        run: |
          mkdir release
          cp "$GAME$BUILD.vpx" release/

          # Add .directb2s file if it exists
          if [ -f "$GAME.directb2s" ]; then cp "$GAME.directb2s" release/; fi

          # Add default ini settings
          if [ -f default_ini_settings.txt ]; then cp default_ini_settings.txt "release/$GAME$BUILD.ini"; fi

          # Add DMD assets
          cp -r StarsHollowDMD release/

      - name: Upload Game Bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.gamename.outputs.game_name }}_${{ steps.version.outputs.build_number }}
          path: release/
