[project]
name = "psc"
version = "0.1.0"
description = "Pinball Show Compiler: light groups and layered light shows for GLF tables"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
psc = "psc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/psc"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
