# Example: `each`. One chase runs inside every groove region at the same time,
# top to bottom within each region, over a dim baseline. The regions have 9 to
# 16 lights; `count` is for the biggest one, and the smaller regions keep
# chasing until it finishes, so every region is moving for the whole show.
# Lights chase in their default colors.
show: psc_region_chases
length: 4s
layers:
  - { target: all_lights, pattern: solid, brightness: 30 }
  - each: [jess, dean, scoop, left_ramp]
    pattern: chase
    order: x
    interval: 80ms
    tail: 120ms
    count: fill
